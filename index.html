<style id="cert-css">
.certificate{max-width:860px;margin:0 auto;padding:14px;background:linear-gradient(135deg,#2a070d,#0A0A0B 60%);border:1px solid #D7192E;border-radius:14px;font-family:Manrope,system-ui,sans-serif;color:#fff}
.certificate .cert-in{border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:44px 40px;text-align:center;display:grid;gap:10px;justify-items:center}
.certificate .brand-big{font-family:Cinzel,Georgia,serif;letter-spacing:.26em;color:#fff;font-size:22px;display:grid;gap:2px;justify-items:center}
.certificate .brand-big strong{font-weight:600}
.certificate .brand-big span{font-family:Manrope,sans-serif;font-size:11px;letter-spacing:.55em;color:#E3283C}
.certificate .crown .cr-body,.certificate .crown .cr-dot{fill:#D7192E}.certificate .crown .cr-band,.certificate .crown .cr-gem{fill:#fff}
.certificate h2{font-family:Cinzel,Georgia,serif;font-size:38px;margin:4px 0;color:#fff;font-weight:600}
.certificate h3{font-size:20px;margin:0;color:#E3283C}
.certificate .muted{color:#A3A3AB;margin:0}
.certificate .small{font-size:13px;color:#d0d0d6}
.certificate .tag{font-family:Cinzel,Georgia,serif;color:#fff;letter-spacing:.06em;margin-top:18px;font-size:13px}
</style>
